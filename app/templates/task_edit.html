{% extends 'base.html' %}

{% block title %}Editar tarea · LifeTrack{% endblock %}

{% block content %}
  <section class="narrow">
    <!-- Encabezado de página -->
    <p class="eyebrow">Tareas</p>
    <h1>Editar tarea</h1>

    <!-- Formulario de edición -->
    <form method="post" class="surface mt-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <!-- Título de la tarea -->
      <label class="form-label" for="title">Título</label>
      <input
        class="form-control mb-3"
        id="title"
        name="title"
        value="{{ task.title }}"
        maxlength="160"
        required
      >

      <!-- Descripción -->
      <label class="form-label" for="description">Descripción</label>
      <textarea
        class="form-control mb-3"
        id="description"
        name="description"
        rows="3"
      >{{ task.description or '' }}</textarea>

      <!-- Prioridad y fecha de vencimiento -->
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="priority">Prioridad</label>
          <select class="form-select" id="priority" name="priority">
            {% for value, label in [('high', 'Alta'), ('medium', 'Media'), ('low', 'Baja')] %}
              <option value="{{ value }}" {{ 'selected' if task.priority == value }}>
                {{ label }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="due_date">Vencimiento</label>
          <input
            class="form-control"
            id="due_date"
            type="date"
            name="due_date"
            value="{{ task.due_date or '' }}"
          >
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary">Guardar cambios</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('tasks.index') }}">
          Cancelar
        </a>
      </div>
    </form>
  </section>
{% endblock %}
